name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Required by gitleaks-action v2 to list PR commits on pull_request events.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
