# NeuralQuant "now + safe" stack on Oracle Cloud Free Tier
# Runs on a single Ampere A1 VM (2 OCPU / 12 GB RAM).
#
# What is here:
#   - Hermes crypto paper-trading worker + state API
#   - nq-trader (Alpaca paper-trading daemon)
#   - quantastra-agent (LiveKit voice agent)
#   - Caddy reverse proxy + TLS
#
# Cron jobs (anjali refresh, market refresh, nightly US/IN) run on the host
# via cron, calling the Render nq-api with CRON_SECRET.
#
# Usage:
#   1. Copy .env.oracle to /opt/neuralquant/.env and fill secrets.
#   2. cd /opt/neuralquant
#   3. docker compose up -d --build
#
# Note: Supabase stays managed. nq-api + nq-openbb stay on Render.

services:
  # ── Hermes crypto paper-trading worker + state API ──────────────────────
  hermes:
    build:
      context: ../../hermes-trading
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      HERMES_TRADING_MODE: ${HERMES_TRADING_MODE:-paper}
      HERMES_API_PORT: ${HERMES_API_PORT:-6900}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-}
      HERMES_BIN: ${HERMES_BIN:-}
      RESEED_STRATEGY: ${RESEED_STRATEGY:-false}
      # Exchange keys (add all that you have)
      KRAKEN_API_KEY: ${KRAKEN_API_KEY:-}
      KRAKEN_PRIVATE_KEY: ${KRAKEN_PRIVATE_KEY:-}
    volumes:
      - hermes_state:/app/state
    expose:
      - "6900"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6900/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: "1.5G"

  # ── NeuralQuant Alpaca paper-trading daemon ─────────────────────────────
  nq-trader:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    command:
      - uv
      - run
      - python
      - trade_daemon.py
    environment:
      ENVIRONMENT: production
      RENDER: "false"
      TRADE_ENABLED: ${TRADE_ENABLED:-true}
      DRY_RUN: ${DRY_RUN:-true}
      ALPACA_PAPER: ${ALPACA_PAPER:-true}
      TRADE_DAEMON_SCAN_INTERVAL_MINUTES: ${TRADE_DAEMON_SCAN_INTERVAL_MINUTES:-15}
      TRADE_DAEMON_STRATEGY: ${TRADE_DAEMON_STRATEGY:-value_play}
      TRADE_DAEMON_BANKROLL: ${TRADE_DAEMON_BANKROLL:-10000.0}
      TRADE_DAEMON_TOP_N: ${TRADE_DAEMON_TOP_N:-10}
      TRADE_DAEMON_MAX_SIGNALS_PER_DAY: ${TRADE_DAEMON_MAX_SIGNALS_PER_DAY:-20}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1G"
    # No ports exposed; daemon polls outbound only.

  # ── QuantAstra / Veronica LiveKit voice agent ───────────────────────────
  quantastra-agent:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    command:
      - uv
      - run
      - python
      - -m
      - quantastra.agent
      - start
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "1.5G"
    # No ports exposed; connects outbound to LiveKit.

  # ── Caddy reverse proxy + automatic HTTPS ───────────────────────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      HERMES_HOST: ${HERMES_HOST:-hermes}
      HERMES_PORT: ${HERMES_API_PORT:-6900}
    depends_on:
      - hermes
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: "256M"

volumes:
  hermes_state:
  caddy_data:
  caddy_config:
